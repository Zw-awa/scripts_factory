[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scripts-factory"
version = "0.2.0"
description = "Local-first AI task orchestration, memory, and reusable skill system."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.13,<2",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
scripts-factory = "scripts_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
